<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Simulator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">

        <header class="header">
            <h1 class="gradient-text"> ट्रेडिंग AlgoTrader Pro</h1>
            <p class="subtitle">Simulador de Inversiones (SMA Strategy)</p>
        </header>

        <main class="main-content">
            <!-- Sidebar Setup -->
            <aside class="sidebar glass-panel">
                <h2>Configuración</h2>

                <div class="input-group">
                    <label for="ticker-select">Selecciona un Activo</label>
                    <select id="ticker-select">
                        <option value="AAPL">Apple (AAPL)</option>
                        <option value="MSFT">Microsoft (MSFT)</option>
                        <option value="TSLA">Tesla (TSLA)</option>
                        <option value="BTC-USD">Bitcoin (BTC-USD)</option>
                        <option value="ETH-USD">Ethereum (ETH-USD)</option>
                        <option value="custom">Personalizado...</option>
                    </select>
                </div>

                <div class="input-group" id="custom-ticker-group" style="display: none;">
                    <label for="custom-ticker">Ticker Personalizado</label>
                    <input type="text" id="custom-ticker" placeholder="Ej. NVDA">
                </div>

                <div class="input-group info-box">
                    <p><strong>Capital Inicial:</strong> 100.00 €</p>
                    <p><strong>Estrategia:</strong> Cruce de Medias Móviles (SMA 14 & 50)</p>
                </div>

                <button id="btn-simulate" class="btn-primary">
                    <span class="btn-text">Ejecutar Simulación</span>
                    <span class="loader" style="display: none;"></span>
                </button>

                <div id="error-message" class="error-toast" style="display: none;"></div>
            </aside>

            <!-- Dashboard Results -->
            <section class="dashboard">
                <div class="metrics-grid">
                    <div class="metric-card glass-panel">
                        <h3>Capital Inicial</h3>
                        <p class="metric-value">100.00 €</p>
                    </div>
                    <div class="metric-card glass-panel">
                        <h3>Capital Final</h3>
                        <p class="metric-value" id="val-final">-- €</p>
                    </div>
                    <div class="metric-card glass-panel highlight-metric">
                        <h3>Rentabilidad</h3>
                        <p class="metric-value" id="val-rentabilidad">-- %</p>
                    </div>
                </div>

                <div class="chart-container glass-panel">
                    <div class="chart-header">
                        <h2>Evolución del Portfolio</h2>
                    </div>
                    <div class="canvas-wrapper">
                        <canvas id="portfolioChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
